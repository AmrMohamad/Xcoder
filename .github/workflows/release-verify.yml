name: Release Verify

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Fresh macOS 26 release gate
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install release test dependency
        run: python3 -m pip install pytest==9.1.1

      - name: Verify release from the fresh checkout
        run: |
          mkdir -p artifacts
          version=$(python3 -c 'import json; print(json.load(open(".codex-plugin/plugin.json"))["version"])')
          bin/xcode release verify \
            --output "$PWD/artifacts/xcoder-$version.zip" \
            --json | tee artifacts/release-verify.json

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcoder-release-evidence
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
